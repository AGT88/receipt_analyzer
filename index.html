<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Receipt Analyzer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- JSZip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Client-Side Extraction Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .preview-container { overflow: auto; position: relative; display: flex; justify-content: center; align-items: flex-start; }
        #image-preview { transition: transform 0.2s ease; transform-origin: top left; }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col font-sans text-gray-800 overflow-hidden">

    <header class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shadow-sm shrink-0">
        <h1 class="text-xl font-bold text-indigo-700"><i class="fa-solid fa-receipt mr-2"></i>Smart Receipt Analyzer</h1>
        <div class="flex gap-3">
            <button onclick="app.downloadAll()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded shadow-sm text-sm font-semibold transition-colors">
                <i class="fa-solid fa-download mr-2"></i>Download All
            </button>
            <button onclick="app.resetAll()" class="px-4 py-2 bg-red-100 hover:bg-red-200 text-red-700 rounded shadow-sm text-sm font-semibold transition-colors">
                <i class="fa-solid fa-trash-can mr-2"></i>Reset All
            </button>
        </div>
    </header>

    <main class="flex flex-1 overflow-hidden">
        <div class="w-1/2 flex flex-col border-r border-gray-200 bg-white">
            <div class="p-6 border-b border-gray-100 shrink-0">
                <div id="drop-zone" class="border-2 border-dashed border-indigo-300 rounded-lg p-8 text-center hover:bg-indigo-50 transition-colors cursor-pointer" onclick="document.getElementById('file-input').click()">
                    <i class="fa-solid fa-cloud-arrow-up text-4xl text-indigo-400 mb-3"></i>
                    <p class="text-gray-600 font-medium">Click or drag files here to analyze</p>
                    <p class="text-xs text-gray-400 mt-2">Supports PDF, JPG, PNG</p>
                    <input type="file" id="file-input" name="file-input" multiple class="hidden" onchange="app.handleFiles(this.files)">
                </div>
            </div>
            <div id="file-list" class="flex-1 overflow-y-auto p-4 space-y-3">
                <div class="text-center text-gray-400 mt-10" id="empty-state">No files uploaded yet.</div>
            </div>
        </div>

        <div class="w-1/2 bg-gray-100 flex flex-col">
            <div class="p-3 bg-white border-b border-gray-200 flex justify-between items-center shadow-sm shrink-0">
                <h2 class="font-semibold text-gray-700" id="preview-title">Preview</h2>
                <div id="zoom-controls" class="hidden gap-2">
                    <button onclick="app.zoomIn()" class="p-1.5 bg-gray-200 hover:bg-gray-300 rounded"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
                    <button onclick="app.zoomOut()" class="p-1.5 bg-gray-200 hover:bg-gray-300 rounded"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
                    <button onclick="app.resetZoom()" class="p-1.5 bg-gray-200 hover:bg-gray-300 rounded"><i class="fa-solid fa-expand"></i></button>
                </div>
            </div>
            <div id="preview-content" class="flex-1 preview-container bg-gray-200 p-4">
                <div class="h-full w-full flex items-center justify-center text-gray-400">Select a file to preview</div>
            </div>
        </div>
    </main>

    <div id="duplicate-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 max-w-sm w-full shadow-xl">
            <h3 class="text-lg font-bold text-gray-900 mb-2"><i class="fa-solid fa-triangle-exclamation text-yellow-500 mr-2"></i>Duplicate File</h3>
            <p id="duplicate-modal-text" class="text-gray-600 mb-6"></p>
            <div class="flex justify-end">
                <button onclick="document.getElementById('duplicate-modal').classList.replace('flex', 'hidden')" class="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700">OK</button>
            </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const app = (function() {
            let filesData = [];
            let currentPreviewId = null;
            let imageZoomLevel = 1;

            const DOM = {
                fileList: document.getElementById('file-list'),
                emptyState: document.getElementById('empty-state'),
                previewContent: document.getElementById('preview-content'),
                previewTitle: document.getElementById('preview-title'),
                zoomControls: document.getElementById('zoom-controls'),
                dropZone: document.getElementById('drop-zone'),
                dupModal: document.getElementById('duplicate-modal'),
                dupModalText: document.getElementById('duplicate-modal-text')
            };

            DOM.dropZone.addEventListener('dragover', (e) => { e.preventDefault(); DOM.dropZone.classList.add('bg-indigo-50', 'border-indigo-500'); });
            DOM.dropZone.addEventListener('dragleave', () => { DOM.dropZone.classList.remove('bg-indigo-50', 'border-indigo-500'); });
            DOM.dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                DOM.dropZone.classList.remove('bg-indigo-50', 'border-indigo-500');
                if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
            });

            function fileToBase64(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = error => reject(error);
                });
            }

            async function handleFiles(files) {
                for (let file of Array.from(files)) {
                    if (filesData.some(f => f.originalName === file.name)) {
                        DOM.dupModalText.innerHTML = `The file <strong>${file.name}</strong> has already been uploaded.`;
                        DOM.dupModal.classList.replace('hidden', 'flex');
                        continue;
                    }

                    const id = 'file_' + Date.now();
                    const dataUrl = await fileToBase64(file);
                    const extension = file.name.split('.').pop().toLowerCase();

                    const fileRecord = {
                        id,
                        fileObj: file,
                        originalName: file.name,
                        newName: 'Reading text...',
                        extension,
                        dataUrl, 
                        status: 'processing'
                    };
                    
                    filesData.push(fileRecord);
                    renderFileList();
                    analyzeFile(fileRecord);
                }
                document.getElementById('file-input').value = '';
            }

            async function analyzeFile(fileRecord) {
                try {
                    let extractedText = "";

                    if (fileRecord.extension === 'pdf') {
                        const pdf = await pdfjsLib.getDocument(fileRecord.dataUrl).promise;
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const textContent = await page.getTextContent();
                            
                            // SPATIAL PDF PARSING: Reconstruct lines based on Y-axis coordinates
                            let lastY = -1;
                            for (let item of textContent.items) {
                                // transform[5] represents the vertical (Y) position of the text
                                if (lastY !== -1 && Math.abs(lastY - item.transform[5]) > 3) {
                                    extractedText += "\n"; // Inject newline if Y-axis jumps
                                }
                                extractedText += item.str + " ";
                                lastY = item.transform[5];
                            }
                            extractedText += "\n";
                        }
                    } else if (['jpg', 'jpeg', 'png'].includes(fileRecord.extension)) {
                        fileRecord.newName = 'Running OCR (May take a moment)...';
                        renderFileList();
                        const worker = await Tesseract.recognize(fileRecord.dataUrl, 'eng');
                        extractedText = worker.data.text;
                    } else {
                        extractedText = fileRecord.originalName; 
                    }

                    const parsedData = parseTextForData(extractedText);
                    fileRecord.newName = formatFilename(parsedData, fileRecord.extension);
                    fileRecord.status = 'complete';

                } catch (error) {
                    console.error("Analysis failed:", error);
                    fileRecord.newName = `[ERROR] - ${fileRecord.originalName}`;
                    fileRecord.status = 'error';
                }
                
                renderFileList();
            }

            /**
             * UPGRADED PARSER
             * Handles Y-axis reconstructed lines and enforces strict word boundaries.
             */
            function parseTextForData(text) {
                let result = {
                    date: "[DATE UNRECOGNIZED]",
                    currency: "AUD", 
                    amount: "[AMOUNT UNRECOGNIZED]",
                    merchant: "[MERCHANT UNRECOGNIZED]",
                    category: "Other" 
                };

                const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                const lowerText = text.toLowerCase();

                // 1. EXTRACT MERCHANT (Looks for Labels first)
                let foundMerchant = false;
                for (let line of lines) {
                    // Match "Venue Menzies Bar", "Store: McDonalds"
                    const labelMatch = line.match(/^(?:Venue|Merchant|Store)[\s\:]+(.+)/i);
                    if (labelMatch) {
                        result.merchant = labelMatch[1].replace(/[^a-zA-Z0-9\s\&\'\-]/g, '').trim().substring(0, 40);
                        foundMerchant = true;
                        break;
                    }
                }
                
                // Merchant Fallback (Top of receipt logic)
                if (!foundMerchant) {
                    const ignoreHeaders = /^(tax invoice|receipt|copy|original|abn|gst|total|date|time)/i;
                    for (let line of lines) {
                        if (/[a-zA-Z]{3,}/.test(line) && !ignoreHeaders.test(line)) {
                            // Split by large gaps just in case columns merged
                            let cleanLine = line.split(/ {3,}/)[0];
                            result.merchant = cleanLine.replace(/[^a-zA-Z0-9\s\&\'\-]/g, '').trim().substring(0, 40);
                            break;
                        }
                    }
                }

                // 2. EXTRACT CATEGORY (Using \b to ensure exact word matches only)
                // "Cabernet" will NO LONGER match "cab".
                if (/\b(uber|grab|ola|taxi|cab|ride)\b/i.test(lowerText)) {
                    result.category = 'Taxi';
                } else if (/\b(park|parking|wilson|secure\s*park)\b/i.test(lowerText)) {
                    result.category = 'Parking';
                } else if (/\b(table|covers|restaurant|cafe|food|eat|dining|bistro|kitchen)\b/i.test(lowerText)) {
                    result.category = 'Meal'; // Triggers on your receipt due to "Table number 721"
                } else if (/\b(bar|liquor|pub|drinks|beverage|wine|beer)\b/i.test(lowerText)) {
                    result.category = 'Drinks';
                }

                // 3. EXTRACT AMOUNT
                const amountMatches = [...text.matchAll(/(\d+\.\d{2})/g)].map(m => parseFloat(m[1]));
                if (amountMatches.length > 0) {
                    const maxAmount = Math.max(...amountMatches);
                    if (maxAmount < 100000) {
                        result.amount = maxAmount.toFixed(2);
                    }
                }

                // 4. EXTRACT DATE
                const dateRegexWord = /(\d{1,2})[\s\-\/\.]+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*[\s\-\/\.]*(\d{2,4})?/i;
                const matchWord = text.match(dateRegexWord);
                
                if (matchWord) {
                    const day = parseInt(matchWord[1], 10);
                    const monthAbbr = matchWord[2].toLowerCase();
                    const monthMap = {
                        jan: "January", feb: "February", mar: "March", apr: "April",
                        may: "May", jun: "June", jul: "July", aug: "August",
                        sep: "September", oct: "October", nov: "November", dec: "December"
                    };
                    result.date = `${day}${getDaySuffix(day)} ${monthMap[monthAbbr]}`;
                } else {
                    const dateRegexNum = /(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/;
                    const matchNum = text.match(dateRegexNum);
                    if (matchNum) {
                        const day = parseInt(matchNum[1], 10);
                        const monthNum = parseInt(matchNum[2], 10) - 1; 
                        const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
                        if (monthNum >= 0 && monthNum <= 11) {
                            result.date = `${day}${getDaySuffix(day)} ${months[monthNum]}`;
                        }
                    }
                }

                return result;
            }

            function getDaySuffix(day) {
                if (day > 3 && day < 21) return 'th';
                switch (day % 10) {
                    case 1:  return "st";
                    case 2:  return "nd";
                    case 3:  return "rd";
                    default: return "th";
                }
            }

            function formatFilename(data, extension) {
                const amountStr = data.amount !== "[AMOUNT UNRECOGNIZED]" ? `${data.currency}${data.amount}` : data.amount;
                return `${data.date} - ${amountStr} - ${data.merchant} - ${data.category}.${extension}`;
            }

            function renderFileList() {
                DOM.emptyState.style.display = filesData.length === 0 ? 'block' : 'none';
                DOM.fileList.innerHTML = '';

                filesData.forEach(file => {
                    const item = document.createElement('div');
                    const isProcessing = file.status === 'processing';
                    const activeClass = currentPreviewId === file.id ? 'border-indigo-500 bg-indigo-50' : 'border-gray-200 bg-white hover:bg-gray-50';
                    
                    item.className = `flex flex-col p-3 border rounded-lg shadow-sm transition-colors cursor-pointer ${activeClass}`;
                    item.onclick = (e) => {
                        if(['INPUT', 'BUTTON', 'I'].includes(e.target.tagName)) return;
                        previewFile(file.id);
                    };

                    item.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <div class="text-xs text-gray-500 truncate max-w-[70%]" title="${file.originalName}">
                                Original: ${file.originalName}
                            </div>
                            <div class="flex gap-2">
                                ${!isProcessing ? `
                                    <button onclick="app.downloadFile('${file.id}')" class="text-indigo-600 hover:text-indigo-800" title="Download">
                                        <i class="fa-solid fa-download"></i>
                                    </button>
                                ` : ''}
                                <button onclick="app.removeFile('${file.id}')" class="text-red-500 hover:text-red-700" title="Remove">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                        </div>
                        <div class="flex items-center">
                            ${isProcessing 
                                ? `<i class="fa-solid fa-spinner fa-spin text-indigo-500 mr-2"></i> <span class="text-gray-500 italic text-sm">${file.newName}</span>`
                                : `<input type="text" 
                                    id="input-${file.id}"
                                    name="filename-${file.id}"
                                    value="${file.newName}" 
                                    onchange="app.updateFileName('${file.id}', this.value)"
                                    class="flex-1 border border-gray-300 rounded px-2 py-1 text-sm font-medium focus:ring-2 focus:ring-indigo-500 outline-none w-full bg-white">`
                            }
                        </div>
                    `;
                    DOM.fileList.appendChild(item);
                });
            }

            function previewFile(id) {
                currentPreviewId = id;
                renderFileList(); 
                
                const file = filesData.find(f => f.id === id);
                if (!file) return;

                DOM.previewTitle.innerText = `Preview: ${file.originalName}`;
                DOM.previewContent.innerHTML = '';
                DOM.zoomControls.classList.add('hidden');
                imageZoomLevel = 1;

                if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(file.extension)) {
                    DOM.zoomControls.classList.remove('hidden');
                    DOM.previewContent.classList.remove('items-center'); 
                    const img = document.createElement('img');
                    img.src = file.dataUrl;
                    img.id = "image-preview";
                    img.className = "max-w-full shadow-lg";
                    DOM.previewContent.appendChild(img);
                } 
                else if (file.extension === 'pdf') {
                    DOM.previewContent.classList.add('items-center');
                    const iframe = document.createElement('iframe');
                    iframe.src = `${file.dataUrl}#toolbar=1&navpanes=0&scrollbar=1`;
                    iframe.className = "w-full h-full border-0 rounded shadow-inner bg-white";
                    DOM.previewContent.appendChild(iframe);
                } 
                else {
                    DOM.previewContent.classList.add('items-center');
                    DOM.previewContent.innerHTML = `
                        <div class="text-center p-8 bg-white rounded shadow-sm border border-gray-200">
                            <i class="fa-solid fa-file-lines text-4xl text-gray-400 mb-3"></i>
                            <p class="text-gray-600 font-medium">Preview not available</p>
                            <p class="text-sm text-gray-500 mt-1">Format (.${file.extension}) cannot be previewed.</p>
                        </div>
                    `;
                }
            }

            return {
                handleFiles,
                updateFileName: (id, newName) => {
                    const file = filesData.find(f => f.id === id);
                    if (file) {
                        if(!newName.endsWith(`.${file.extension}`)) newName = `${newName}.${file.extension}`;
                        file.newName = newName;
                    }
                },
                removeFile: (id) => {
                    const fileIndex = filesData.findIndex(f => f.id === id);
                    if (fileIndex > -1) {
                        filesData.splice(fileIndex, 1);
                        if (currentPreviewId === id) {
                            currentPreviewId = null;
                            DOM.previewContent.innerHTML = '<div class="h-full w-full flex items-center justify-center text-gray-400">Select a file to preview</div>';
                            DOM.previewTitle.innerText = 'Preview';
                            DOM.zoomControls.classList.add('hidden');
                        }
                        renderFileList();
                    }
                },
                resetAll: () => {
                    if(!confirm("Are you sure you want to clear all files?")) return;
                    filesData = [];
                    currentPreviewId = null;
                    DOM.previewContent.innerHTML = '<div class="h-full w-full flex items-center justify-center text-gray-400">Select a file to preview</div>';
                    DOM.previewTitle.innerText = 'Preview';
                    DOM.zoomControls.classList.add('hidden');
                    renderFileList();
                },
                downloadFile: (id) => {
                    const file = filesData.find(f => f.id === id);
                    if (!file) return;
                    const a = document.createElement('a');
                    a.href = file.dataUrl;
                    a.download = file.newName;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                },
                downloadAll: async () => {
                    if (filesData.length === 0) return alert("No files to download.");
                    if (filesData.some(f => f.status === 'processing')) return alert("Please wait for all files to finish analyzing.");

                    const zip = new JSZip();
                    filesData.forEach(file => {
                        const base64Data = file.dataUrl.split(',')[1]; 
                        zip.file(file.newName, base64Data, {base64: true});
                    });

                    try {
                        const content = await zip.generateAsync({ type: "blob" });
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(content);
                        a.download = `Receipts_${new Date().toISOString().split('T')[0]}.zip`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                    } catch (e) {
                        console.error("Zip generation failed", e);
                        alert("Failed to create zip file.");
                    }
                },
                zoomIn: () => {
                    const img = document.getElementById('image-preview');
                    if(img) { imageZoomLevel += 0.25; img.style.transform = `scale(${imageZoomLevel})`; }
                },
                zoomOut: () => {
                    const img = document.getElementById('image-preview');
                    if(img && imageZoomLevel > 0.25) { imageZoomLevel -= 0.25; img.style.transform = `scale(${imageZoomLevel})`; }
                },
                resetZoom: () => {
                    const img = document.getElementById('image-preview');
                    if(img) { imageZoomLevel = 1; img.style.transform = `scale(1)`; }
                }
            };
        })();
    </script>
</body>
</html>
